<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --primary: #8e2de2;
      --secondary: #4a00e0;
      --bg: #0f0c20;
      --card: rgba(255, 255, 255, 0.05);
      --text: #ffffff;
      --text-muted: #a0aec0;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0c20 0%, #15102a 100%);
      color: var(--text);
      width: 340px;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      box-shadow: 0 0 12px var(--primary);
    }

    h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #ffffff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-card,
    .config-card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(10px);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .status-label {
      color: var(--text-muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .status-value {
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .badge.connected {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .badge.disconnected {
      background-color: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 7px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(142, 45, 226, 0.25);
    }

    .btn-sync,
    .btn-save {
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-sync {
      background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
      box-shadow: 0 4px 15px rgba(142, 45, 226, 0.3);
    }

    .btn-save {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 13px;
    }

    .btn-sync:hover,
    .btn-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(142, 45, 226, 0.45);
    }

    .btn-sync:active,
    .btn-save:active {
      transform: translateY(1px);
    }

    .btn-sync:disabled,
    .btn-save:disabled {
      opacity: 0.6;
      cursor: default;
      transform: none;
    }

    .hint {
      font-size: 11px;
      line-height: 1.45;
      color: var(--text-muted);
    }

    .hint.warning {
      color: var(--warning);
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icon.png" class="logo-img">
      <h2>Gemini Api Agent</h2>
    </div>

    <div class="status-card">
      <div class="status-row">
        <span class="status-label">Server Connection</span>
        <span class="status-value" id="conn-status">
          <span class="badge disconnected" id="status-badge"></span>
          <span id="status-text">Disconnected</span>
        </span>
      </div>
      <div class="status-row">
        <span class="status-label">Last Sync</span>
        <span class="status-value" id="last-sync" style="color: var(--text-muted);">Never</span>
      </div>
    </div>

    <div class="config-card">
      <label>
        Server API URL
        <input id="server-url" type="url" placeholder="http://127.0.0.1:8100" spellcheck="false">
      </label>
      <label>
        WebSocket Port
        <input id="ws-port" type="text" inputmode="numeric" placeholder="9226" spellcheck="false">
      </label>
      <label>
        Sync Token
        <input id="ws-token" type="password" placeholder="Paste API_TOKEN from .env" autocomplete="off">
      </label>
      <button class="btn-save" id="save-btn">Save Configuration</button>
      <div class="hint" id="config-hint">
        Paste the API_TOKEN value from <code>free-gemini-api/.env</code>, then click Save.
      </div>
    </div>

    <button class="btn-sync" id="sync-btn">Force Sync Cookies</button>

    <div class="footer">
      Cookies are sent only to the configured backend and never copied to the clipboard.
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
